name: Contribuciones

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: snake
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generar el recorrido de contribuciones
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#d7ff4f&color_dots=#171a19,#394020,#7fa02b,#a9d63a,#d7ff4f
            dist/snake-light.svg?palette=github-light&color_snake=#46520a&color_dots=#e9ebe4,#c6cbbe,#9aad3a,#6b7c18,#46520a

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
